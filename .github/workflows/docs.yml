name: Docs CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-docs:
    name: Generate Docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Generate docs
        run: go generate ./...

      - name: Open PR with updated docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Docs are already up to date."
            exit 0
          fi
          BRANCH="docs/auto-update-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "docs: auto-generate provider documentation"
          git push origin "$BRANCH"
          gh pr create \
            --title "docs: auto-generate provider documentation" \
            --body "Automated docs update triggered by a push to main. Generated by the Docs CI workflow." \
            --head "$BRANCH" \
            --base main

  mdvalidate:
    name: Validate Markdown Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 1

      - name: Markdown Link Validation
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1
        with:
          config-file: "./.github/github-action-markdown-link-check-config.json"
