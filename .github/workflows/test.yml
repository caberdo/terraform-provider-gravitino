name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --config .github/golangci.yml

      - name: Check for unreferenced client methods
        run: ./scripts/dead-client-methods.sh

      - name: Run Gosec Security Scanner
        id: gosec
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0
        continue-on-error: true
        env:
          GOTOOLCHAIN: auto
        with:
          args: -fmt sarif -out gosec.sarif -exclude-dir=vendor -tests=false ./

      - name: Upload security scan results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('gosec.sarif') != ''
        with:
          sarif_file: gosec.sarif

      - name: Fail on Gosec findings
        if: always() && steps.gosec.outcome == 'failure'
        run: |
          {
            echo "## Gosec Security Scanner Found Issues"
            echo ""
            if [ -f gosec.sarif ]; then
              echo "| Rule | File | Line | Description |"
              echo "|------|------|------|-------------|"
              jq -r '.runs[0].results[] | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri) | \(.locations[0].physicalLocation.region.startLine) | \(.message.text) |"' gosec.sarif
            fi
            echo ""
            echo "See the **Security** tab for full details."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # The released binary's module graph is scanned for advisories that its own
  # code can reach: a dependency bump is not enough on its own, because a
  # transitive module can be introduced by an unrelated change. Both the
  # toolchain and golang.org/x/net are kept above the fixed versions in go.mod;
  # this job fails the pull request that lowers either of them back below.
  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # The Go version from go.mod, not the action's default `stable`, so
          # the scan uses the toolchain the release binary is built with.
          go-version-file: go.mod
          repo-checkout: false
          go-package: ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, vuln]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Verify go.mod is tidy and module hashes match
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Cross-platform build
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - name: Validate examples
        env:
          REQUIRE_TERRAFORM: "1"
        run: ./scripts/validate-examples.sh

      - name: Check generated docs are up to date
        run: |
          go generate ./...
          git diff --exit-code -- docs/

      - name: Run tests
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./internal/...

      - name: Coverage summary
        if: always()
        run: |
          if [[ ! -f coverage.out ]]; then
            echo "No coverage profile: the test step failed before writing one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Coverage"
            echo ""
            echo "Unit tests only: the per-package profile \`TestAcc*\` and \`TestLiveAcc*\` leave"
            echo "out (\`TF_ACC\`, a real server). The \`Coverage\` job on a pull request, and the"
            echo "\`acceptance\` job on \`main\`, report the merged unit + acceptance profile that"
            echo "\`.github/coverage-baseline.txt\` measures and \`scripts/coverage-gate.sh\` enforces."
            echo ""
            ./scripts/coverage-summary.sh coverage.out
          } >> "$GITHUB_STEP_SUMMARY"
          ./scripts/coverage-summary.sh coverage.out

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  # A pull request cannot make the project less tested than it was: run the same
  # acceptance container `main` runs, merge its profile with the unit profile and
  # fail when a scope in .github/coverage-baseline.txt is below its floor. The
  # floor is calibrated on the merged profile, so the gate is never handed a
  # unit-only number, and it exits 2 (not 0) when the profile or a floor is
  # missing. README.md's badge and block come from the same baseline, so they are
  # checked for drift in the same job.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # README's badge and coverage block are generated from the same baseline the
      # gate enforces, so a dropped floor or a stale README fails here.
      - name: README in sync with the coverage baseline
        run: ./scripts/coverage-readme.sh --check

      - name: Unit-test coverage
        run: go test -count=1 -skip '^(TestAcc|TestLiveAcc)' -covermode=atomic -coverprofile=coverage.out ./internal/...

      # The container writes coverage-acceptance.out into the mounted worktree. The
      # floor is calibrated on the newest supported server, so run that one, not the
      # compose default: a 1.3.0 server skips the 1.3.1-gated tests and must not be
      # gated against a 1.3.1-calibrated floor.
      - name: Run acceptance tests
        run: |
          GRAVITINO_VERSION="$(grep -v '^[[:space:]]*$' .github/gravitino-versions.txt | sort -V | tail -n 1)" \
            docker compose run --rm test

      - name: Coverage gate (unit + acceptance)
        run: |
          ./scripts/merge-coverage.sh coverage-union.out coverage.out coverage-acceptance.out
          ./scripts/coverage-gate.sh coverage-union.out
          {
            echo "## Coverage (unit + acceptance)"
            echo ""
            echo "\`coverage.out\` and \`coverage-acceptance.out\` merged by \`scripts/merge-coverage.sh\`"
            echo "and checked against the floors in \`.github/coverage-baseline.txt\` by"
            echo "\`scripts/coverage-gate.sh\`."
            echo ""
            ./scripts/coverage-summary.sh coverage-union.out
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  gravitino_versions:
    name: Supported Gravitino Versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only the acceptance job consumes this, and that job only runs on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      list: ${{ steps.read.outputs.list }}
      latest: ${{ steps.read.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the supported versions into a JSON array
        id: read
        run: |
          # Both sides filter on non-whitespace so a blank or whitespace-only line cannot
          # make the matrix non-empty while `latest` is empty, which would skip every
          # cell's coverage gate without failing a step.
          list=$(jq -R -s -c 'split("\n") | map(select(test("\\S")))' .github/gravitino-versions.txt)
          latest=$(grep -v '^[[:space:]]*$' .github/gravitino-versions.txt | sort -V | tail -n 1)
          if [[ -z "$latest" ]]; then
            echo "no supported Gravitino version found in .github/gravitino-versions.txt" >&2
            exit 1
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  acceptance:
    name: Acceptance Tests (Gravitino ${{ matrix.gravitino }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - test
      - gravitino_versions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        # Single source of truth: .github/gravitino-versions.txt, also read by `make testacc-matrix`.
        gravitino: ${{ fromJSON(needs.gravitino_versions.outputs.list) }}
    env:
      GRAVITINO_VERSION: ${{ matrix.gravitino }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      # The acceptance container writes coverage-acceptance.out into the mounted
      # worktree; the unit profile is produced here so both can be merged into the
      # one statement-coverage number the project publishes.
      - name: Unit-test coverage
        run: go test -count=1 -skip '^(TestAcc|TestLiveAcc)' -covermode=atomic -coverprofile=coverage.out ./internal/...

      - name: Run acceptance tests
        run: docker compose run --rm test

      - name: Combined coverage (unit + acceptance)
        if: always()
        run: |
          if [[ ! -f coverage.out || ! -f coverage-acceptance.out ]]; then
            echo "Incomplete coverage profiles: unit \`coverage.out\` and acceptance" >> "$GITHUB_STEP_SUMMARY"
            echo "\`coverage-acceptance.out\` are both required; one is missing." >> "$GITHUB_STEP_SUMMARY"
            # Fail here, with the missing input named, rather than leaving the gate
            # below to report "profile not found" and mask the cause. The gate still
            # fails closed (exit 2) if it is ever invoked without a profile.
            exit 1
          fi
          ./scripts/merge-coverage.sh coverage-union.out coverage.out coverage-acceptance.out
          {
            echo "## Coverage (unit + acceptance)"
            echo ""
            echo "\`coverage.out\` and \`coverage-acceptance.out\` merged by \`scripts/merge-coverage.sh\`."
            echo ""
            ./scripts/coverage-summary.sh coverage-union.out
          } >> "$GITHUB_STEP_SUMMARY"

      # `main` repeats the pull-request gate in the newest cell only: the older
      # cells legitimately skip version-gated tests, so a floor calibrated on the
      # newest server would fail them for the wrong reason.
      - name: Coverage gate (unit + acceptance)
        if: matrix.gravitino == needs.gravitino_versions.outputs.latest
        run: ./scripts/coverage-gate.sh coverage-union.out
