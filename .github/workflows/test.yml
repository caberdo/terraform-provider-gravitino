# CI is delegated to the reusable workflows in caberdo/terraform-provider-kit.
#
# The triggers, the concurrency group and the token scopes stay here: a
# `workflow_call` file cannot declare triggers, and a called workflow can only
# narrow the token its caller grants. Everything else — the job steps, the
# versions-matrix parser, the coverage gate — lives in the kit.
#
# The old separate docs workflow is folded in here: the kit keeps the docs job
# and the Markdown link check inside `provider-ci.yml`, and calling it twice
# would run lint, test and the vulnerability scan twice. Its `tags: ["v*"]`
# trigger is kept on this file so a signed tag pushed from a maintainer machine
# still gets the Markdown link check it got before; the docs job itself only
# opens a pull request on a push to `main`, exactly as the old workflow did.
name: Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-ci.yml@v0.17.0
    # GitHub validates a caller's grant against every job of the called workflow
    # before any `if:` or input is evaluated, so these are the union of what
    # provider-ci declares, not what this run happens to execute:
    #
    # - `contents: write` + `pull-requests: write`: requested unconditionally by
    #   the called `docs` job. Omitting them rejects the whole run with "The
    #   nested job 'docs' is requesting 'contents: write, pull-requests: write'"
    #   — even when `docs-mode: autopr` only uses them on a push to main.
    # - `security-events: write`: the `Lint & Security` job uploads gosec SARIF
    #   to code scanning.
    #
    # This does not widen the token any other job runs with: every other job in
    # provider-ci.yml re-declares `contents: read` (and nothing else), and a
    # called job can narrow the caller's grant, never widen it. It is also the
    # grant the old docs workflow's `generate-docs` job had, and nothing more.
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    with:
      provider: gravitino
      provider-display: Gravitino
      # Gravitino's module path is outside the caberdo organisation; the called
      # workflow verifies it against `go list -m` before the build starts.
      module: github.com/gravitino/terraform-provider-gravitino
      packages: ./internal/...
      golangci-config: .github/golangci.yml
      # The matrix source of truth, named here so it cannot drift from the
      # acceptance call below.
      versions-file: .github/gravitino-versions.txt
      # Keep a versions job. Its context is the kit's static `Supported Versions`
      # (the old display name was `Supported Gravitino Versions`); only `main`
      # consumes the matrix, as before.
      versions-job: true
      # There is no version file: the newest CHANGELOG.md section names the
      # version, and a merge is not a release. `changelog: true` runs the check
      # that compares that section with the README install constraint and
      # reports the last tag beside the verdict (pending release / released),
      # so a release pull request passes; `tfkit release check` runs the same
      # check locally.
      changelog: true
      # Every pull request that can change what a user sees carries a fragment
      # in changelog.d/ instead of editing CHANGELOG.md.
      changelog-fragments: true
      # Keep dependency scanning in its own `Vulnerability Scan` job, as it is
      # today, instead of moving it into `Lint & Security`.
      govuln-mode: action
      # Keep `./scripts/dead-client-methods.sh` in the lint job.
      lint-extra-script: ./scripts/dead-client-methods.sh
      # The kit's `tfkit examples validate` treats every directory under
      # `examples/` as a standalone module. Gravitino's snippets are fragments
      # that reference a metalake/catalog/schema declared by a sibling snippet, so
      # they only validate when concatenated into one synthetic module — which is
      # what `scripts/validate-examples.sh` (and its Python validator) does, and
      # what the old Test job ran. Disable the kit's examples step and keep that
      # validator in the local `examples` job below until the kit can take a
      # provider-specific command.
      examples: false
      # The generated docs must not drift; the drift check stays in the Test job
      # on every run, as it does today.
      docs: true
      # On a push to main, regenerate `docs/` and open a pull request instead of
      # failing, which is what the old docs workflow's `generate-docs` job did.
      docs-mode: autopr
      docs-drift-in-test: true
      docs-untracked-check: false
      # The old docs workflow's `mdvalidate` job ran the same link checker.
      markdown: true
      # The old `Coverage` job ran on pull requests only, after the acceptance
      # container on the newest supported server; the floor is calibrated on that
      # merged profile, so the job must keep producing and gating it.
      coverage-job: pull_request
      coverage-merged: true
      coverage-timeout: 40
      # The Test job only publishes the unit table; the gate lives in Coverage.
      coverage-gate-in-test: false
      coverage-readme: true
      coverage-readme-in-test: false
      unit-skip-regex: ^(TestAcc|TestLiveAcc)
      # `GRAVITINO_VERSION` must name the newest supported server, not the
      # compose default: a 1.3.0 server skips the 1.3.1-gated tests and must not
      # be measured against a 1.3.1-calibrated floor.
      acceptance-compose: GRAVITINO_VERSION=$(grep -v '^[[:space:]]*$' .github/gravitino-versions.txt | sort -V | tail -n 1) docker compose run --rm test
      dependency-review: true
      # Keeps the Coverage section of the job summary in the same shape as the
      # retired per-package summary paragraph.
      coverage-note: "Unit tests only: the per-function profile `TestAcc*` and `TestLiveAcc*` leave out (`TF_ACC`, a real server). The `Coverage` job on a pull request, and the `acceptance` job on `main`, report the merged unit + acceptance profile that `.github/coverage-baseline.txt` measures and `make coverage-gate` enforces."

  # Provider-specific until the kit can take a custom examples command: the old
  # Test job's `Validate examples` step, unchanged, on the same triggers as `ci`.
  # It is not a caller because `provider-ci.yml`'s examples step is the
  # standalone-module validator described above.
  examples:
    name: Validate Examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      - name: Validate examples
        env:
          REQUIRE_TERRAFORM: "1"
        run: ./scripts/validate-examples.sh

  # The old acceptance matrix ran on a push to main only, after `test`; a caller
  # cannot express `needs.<job>.result` across a reusable-workflow boundary, so
  # `needs: ci` is the only faithful spelling. The `if:` keeps the same
  # trigger-level restriction the old docs workflow and the old acceptance job
  # had: no acceptance legs on pull requests or tag pushes.
  acceptance:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-acceptance.yml@v0.17.0
    permissions:
      contents: read
    with:
      provider: gravitino
      provider-display: Gravitino
      packages: ./internal/...
      versions-file: .github/gravitino-versions.txt
      version-env: GRAVITINO_VERSION
      # One compose project per version so the matrix cannot share containers,
      # volumes or port bindings.
      compose-project-prefix: gravitino
      # Docker Compose accepts only lowercase alphanumerics, hyphens and
      # underscores in a project name, so the dotted matrix version must become
      # `1-3-0`: without this the assembled `gravitino-acc-1.3.0` is rejected
      # with "invalid project name" before any container starts.
      compose-dot-to-dash: true
      max-parallel: 2
      acceptance-timeout: 30
      unit-skip-regex: ^(TestAcc|TestLiveAcc)
      # The floor is calibrated on the newest server, so only that cell gates;
      # older cells legitimately skip the version-gated tests.
      gate-cell: newest
