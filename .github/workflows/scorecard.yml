# OpenSSF Scorecard: weekly supply-chain security assessment of this repository.
#
# The result is published to the OpenSSF API (which is what the README badge
# reads) and uploaded to GitHub code scanning as SARIF. It runs on main, on a
# schedule and whenever branch protection changes, because several checks look
# at exactly that. The analysis itself is the reusable workflow in
# caberdo/terraform-provider-kit.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Mondays, 04:23 UTC (off the top of the hour: the OpenSSF API is busy then).
    - cron: "23 4 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  scorecard:
    uses: caberdo/terraform-provider-kit/.github/workflows/provider-scorecard.yml@v0.12.0
    # `security-events: write` uploads the SARIF result to code scanning and
    # `id-token: write` lets publish_results sign it through OIDC; the rest is
    # read-only. A called workflow cannot widen this grant.
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
