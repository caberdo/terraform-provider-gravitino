# Creates a release tag and publishes the release.
#
# The tag is GPG-signed with the key in the `GPG_PRIVATE_KEY` secret. GitHub only
# shows the tag as "Verified" when the signature can be checked against a key
# registered to the account that owns the tagger email, so the git identity is
# taken from the imported key instead of the github-actions[bot] identity.
#
# Tags pushed with the default GITHUB_TOKEN do not trigger other workflows, so
# the release workflow is invoked explicitly in the `release` job below rather
# than relying on the `push: tags: v*` trigger in release.yml. That trigger is
# still needed for signed tags pushed from a developer machine.
#
# If a release fails after the tag was pushed, do not re-run this workflow: it
# would calculate the next version instead of the one that failed. Dispatch the
# Release workflow manually instead, with `tag` set to the tag to republish;
# goreleaser runs with `release.mode: replace`, so that is idempotent.
name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (leave empty to auto-calculate from release_type)"
        required: false
        type: string
        default: ""
      release_type:
        description: "Type of release (used when version is empty)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"

permissions:
  contents: read

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.new }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get latest version and calculate next
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          LATEST_VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
          MANUAL_VERSION="${{ github.event.inputs.version }}"

          if [[ -n "$MANUAL_VERSION" ]]; then
            if [[ ! "$MANUAL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: Version must be in format X.Y.Z"
              exit 1
            fi
            NEW_VERSION="$MANUAL_VERSION"
            echo "Using manual version: $NEW_VERSION"
          else
            RELEASE_TYPE="${{ github.event.inputs.release_type }}"
            case "$RELEASE_TYPE" in
              major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
            echo "Calculated $RELEASE_TYPE version: $NEW_VERSION"
          fi

          echo "latest=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "new=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=v$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Check tag doesn't exist
        run: |
          if git rev-parse "${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Error: tag ${{ env.VERSION }} already exists"
            echo "To publish (or republish) that tag without touching it, dispatch the"
            echo "Release workflow manually with inputs.tag set to ${{ env.VERSION }}."
            exit 1
          fi

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          git_user_signingkey: true
          git_tag_gpgsign: true

      - name: Create and push signed tag
        run: |
          # GitHub maps the tagger email to an account and looks the signature up
          # in that account's registered keys, so use the signing key identity.
          git config user.name "${{ steps.import_gpg.outputs.name }}"
          git config user.email "${{ steps.import_gpg.outputs.email }}"
          git tag -s "${{ env.VERSION }}" -m "Release ${{ env.VERSION }}"
          git tag -v "${{ env.VERSION }}"
          git push origin "${{ env.VERSION }}"

      - name: Summary
        run: |
          {
            echo "## Release Tag Created"
            echo "| Previous | **${{ steps.version.outputs.latest }}** |"
            echo "| New Tag  | **${{ steps.version.outputs.new }}** |"
            echo "| Commit   | **${{ github.sha }}** |"
            echo "| Signed by | **${{ steps.import_gpg.outputs.fingerprint }}** |"
            echo ""
            echo "The release workflow is invoked next to build and publish the provider."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: create-tag
    # A reusable workflow can only use the permissions the calling job grants,
    # so the release job passes on the two scopes it attests with on top of
    # `contents: write`: `id-token` for the OIDC identity and `attestations` for
    # the attestation record.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag: ${{ needs.create-tag.outputs.tag }}
