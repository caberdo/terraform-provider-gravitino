version: 2

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats:
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  # The Terraform Registry reads protocol_versions from this asset; without it the
  # released version cannot be published.
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  mode: replace
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  header: |
    ## Terraform Provider for Apache Gravitino {{ .Tag }}

    To install this provider, copy and paste this code into your Terraform configuration:

    ```hcl
    terraform {
      required_providers {
        gravitino = {
          source  = "gravitino/gravitino"
          version = "{{ .Version }}"
        }
      }
    }

    provider "gravitino" {
      uri      = "http://localhost:8090"
      auth     = "basic"
      username = "admin"
      password = "admin"
    }
    ```

changelog:
  use: github-native
