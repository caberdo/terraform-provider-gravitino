services:
  gravitino:
    # Override to test another supported server version: GRAVITINO_VERSION=1.3.1 docker compose run --rm test
    image: apache/gravitino:${GRAVITINO_VERSION:-1.3.0}
    ports:
      - "8090:8090"
      - "9001:9001"
    environment:
      GRAVITINO_SERVER_HTTP_PORT: 8090
      # Roles, owners and permissions are only served when authorization is enabled.
      GRAVITINO_AUTHORIZATION_ENABLE: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  test:
    image: golang:1.27.2
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
    working_dir: /app
    command:
      - bash
      - -c
      - |
        go mod download && go mod verify
        # Coverage is collected here because the unit suite alone under-reports
        # packages whose behaviour is asserted end-to-end against a real server.
        # The profile lands in the mounted worktree, where `make coverage-merge`
        # and the acceptance job pick it up.
        go test -v -timeout 30m \
          -covermode=atomic -coverprofile=/app/coverage-acceptance.out -coverpkg=./internal/... \
          ./internal/...
        status=$$?
        if [ -f coverage-acceptance.out ]; then
          echo "Acceptance coverage (covered statements, ./internal/...):"
          go tool cover -func=coverage-acceptance.out | tail -1
        fi
        exit $$status
    environment:
      TF_ACC: "1"
      GRAVITINO_URI: "http://gravitino:8090"
      GRAVITINO_EXPECT_VERSION: "${GRAVITINO_VERSION:-1.3.0}"
      GRAVITINO_AUTH: "none"
      GRAVITINO_USERNAME: ""
      GRAVITINO_PASSWORD: ""
      GRAVITINO_OAUTH_TOKEN: ""
    depends_on:
      gravitino:
        condition: service_healthy

  acc:
    image: golang:1.27.2
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
    working_dir: /app
    entrypoint: ["bash", "/app/scripts/testacc-live.sh"]
    environment:
      TF_ACC: "1"
      GRAVITINO_URI: "http://gravitino:8090"
      GRAVITINO_AUTH: "none"
      GRAVITINO_USERNAME: ""
      GRAVITINO_PASSWORD: ""
      GRAVITINO_OAUTH_TOKEN: ""
      GRAVITINO_EXPECT_VERSION: "${GRAVITINO_VERSION:-1.3.0}"
    depends_on:
      gravitino:
        condition: service_healthy

volumes:
  go-modules:
