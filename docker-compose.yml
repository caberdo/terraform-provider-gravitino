services:
  gravitino:
    # Override to test another supported server version: GRAVITINO_VERSION=1.1.1 docker compose run --rm test
    image: apache/gravitino:${GRAVITINO_VERSION:-1.3.0}
    ports:
      - "8090:8090"
      - "9001:9001"
    environment:
      GRAVITINO_SERVER_HTTP_PORT: 8090
      # Roles, owners and permissions are only served when authorization is enabled.
      GRAVITINO_AUTHORIZATION_ENABLE: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  test:
    image: golang:1.27.4
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
    working_dir: /app
    command:
      - bash
      - -c
      - |
        # terraform-plugin-testing installs Terraform through the checkpoint API
        # when it cannot find a binary, and that endpoint intermittently answers
        # 502 or resets the connection -- an environmental failure that reddens
        # CI and hides real ones. Install a pinned release from the CDN instead
        # and point the library at it (TF_ACC_TERRAFORM_PATH below). Skipped
        # when the image already ships a terraform binary.
        if ! command -v terraform >/dev/null 2>&1; then
          terraform_version="1.11.4"
          # The release filenames are linux_amd64 and linux_arm64, and an amd64
          # binary cannot execute on the arm64 images Apple Silicon runs.
          terraform_arch="$$(dpkg --print-architecture)"
          (apt-get update -qq && apt-get install -y -qq unzip curl) >/dev/null
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/$${terraform_version}/terraform_$${terraform_version}_linux_$${terraform_arch}.zip"
          unzip -oq /tmp/terraform.zip -d /usr/local/bin
          rm -f /tmp/terraform.zip
        fi
        go mod download && go mod verify
        # Coverage is collected here because the unit suite alone under-reports
        # packages whose behaviour is asserted end-to-end against a real server.
        # The profile lands in the mounted worktree, where `make coverage-merge`
        # and the acceptance job pick it up.
        go test -v -timeout 30m \
          -covermode=atomic -coverprofile=/app/coverage-acceptance.out -coverpkg=./internal/... \
          ./internal/...
        status=$$?
        if [ -f coverage-acceptance.out ]; then
          echo "Acceptance coverage (covered statements, ./internal/...):"
          go tool cover -func=coverage-acceptance.out | tail -1
        fi
        exit $$status
    environment:
      TF_ACC: "1"
      # The binary installed above; without it the library falls back to the
      # checkpoint API.
      TF_ACC_TERRAFORM_PATH: "/usr/local/bin/terraform"
      GRAVITINO_URI: "http://gravitino:8090"
      GRAVITINO_EXPECT_VERSION: "${GRAVITINO_VERSION:-1.3.0}"
      GRAVITINO_AUTH: "none"
      GRAVITINO_USERNAME: ""
      GRAVITINO_PASSWORD: ""
      GRAVITINO_OAUTH_TOKEN: ""
    depends_on:
      gravitino:
        condition: service_healthy

  acc:
    image: golang:1.27.4
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
    working_dir: /app
    entrypoint: ["bash", "/app/scripts/testacc-live.sh"]
    environment:
      TF_ACC: "1"
      GRAVITINO_URI: "http://gravitino:8090"
      GRAVITINO_AUTH: "none"
      GRAVITINO_USERNAME: ""
      GRAVITINO_PASSWORD: ""
      GRAVITINO_OAUTH_TOKEN: ""
      GRAVITINO_EXPECT_VERSION: "${GRAVITINO_VERSION:-1.3.0}"
    depends_on:
      gravitino:
        condition: service_healthy

volumes:
  go-modules:
